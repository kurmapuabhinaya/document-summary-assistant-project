<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Document Summary Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Document Summary Assistant</h1>
    <p>Paste or upload your text and get a quick summary.</p>
  </header>

  <main class="container">
    <section class="input-section">
      <div class="section-header">
        <h2>Input Document</h2>
        <label class="file-label">
          <input type="file" id="fileInput" accept=".txt" />
          Upload .txt file
        </label>
      </div>

      <textarea
        id="inputText"
        placeholder="Paste your document text here or upload a .txt file..."
      ></textarea>

      <div class="controls">
        <div class="control-group">
          <label for="summaryLength">Summary length:</label>
          <select id="summaryLength">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="long">Long</option>
          </select>
        </div>

        <div class="stats">
          <span id="charCount">0 characters</span> ·
          <span id="wordCount">0 words</span>
        </div>

        <div class="buttons">
          <button id="summarizeBtn">Generate Summary</button>
          <button id="clearBtn" class="secondary">Clear</button>
        </div>
      </div>
    </section>

    <section class="output-section">
      <h2>Summary</h2>
      <div id="summaryBox" class="summary-box">
        <p class="placeholder">Your summary will appear here.</p>
      </div>
      <button id="copySummaryBtn" class="copy-btn">Copy Summary</button>
    </section>
  </main>

  <footer class="footer">
    <p>Made by [Your Name] · B.Tech CSE (AI)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
